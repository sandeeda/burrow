name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install ffmpeg (video thumbnail tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...

      - name: Fuzz path handling and HEIC decoding
        shell: bash
        run: |
          go test ./internal/fsjail -run '^$' -fuzz '^FuzzClean$' -fuzztime 30s
          go test ./internal/fsjail -run '^$' -fuzz '^FuzzJailOpen$' -fuzztime 30s
          go test ./internal/api -run '^$' -fuzz '^FuzzSanitizeUploadName$' -fuzztime 30s
          go test ./internal/thumbs -run '^$' -fuzz '^FuzzDecodeHEIC$' -fuzztime 30s

  web:
    name: Web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        working-directory: web
        run: npm ci
      - name: Typecheck + build
        working-directory: web
        run: npm run build
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build binary with embedded app
        run: go build -o burrow ./cmd/burrow

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
